name: Build ffmpeg-webrtc packages

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read
  actions: read
  security-events: write

jobs:
  version:
    name: Generate release version
    uses: DigitalPath-Inc/.github-private/.github/workflows/semver-bump.yaml@master
    with:
      fail_on_error: false
  release:
    name: Create GitHub Release
    uses: DigitalPath-Inc/.github-private/.github/workflows/github-release.yaml@master
    needs:
      - version
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      gh-app-id: ${{ secrets.GH_CROSS_REPO_APP_ID }}
      gh-app-key: ${{ secrets.GH_CROSS_REPO_KEY }}
  build:
    name: Build ffmpeg-webrtc packages
    needs:
      - version
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential yasm nasm libx264-dev libssl-dev libsrt-openssl-dev libvpx-dev

      - name: Build Ubuntu FFmpeg
        run: |
          ./configure --prefix=/opt/ffmpeg-webrtc --enable-muxer=whip --enable-openssl --enable-libx264 --enable-gpl --enable-nonfree --enable-static --disable-shared --enable-libsrt --enable-libvpx
          make -j$(nproc)
          cp ffmpeg ffmpeg-ubuntu
          cp ffprobe ffprobe-ubuntu

      - name: Build Alpine FFmpeg
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            alpine:3.21 sh -c "
              apk add --no-cache build-base yasm nasm x264-dev openssl-dev srt-dev libvpx-dev pkgconf &&
              ./configure \
                --prefix=/opt/ffmpeg-webrtc \
                --enable-muxer=whip \
                --enable-openssl \
                --enable-libx264 \
                --enable-gpl \
                --enable-nonfree \
                --enable-static \
                --disable-shared \
                --enable-libsrt \
                --enable-libvpx &&
              make -j\$(nproc) &&
              cp ffmpeg /workspace/ffmpeg-alpine &&
              cp ffprobe /workspace/ffprobe-alpine
            "

      - name: Prepare Ubuntu .deb
        run: |
          mkdir -p deb/DEBIAN
          cat << EOF > deb/DEBIAN/control
          Package: ffmpeg-webrtc
          Version: ${{ needs.version.outputs.version }}
          Architecture: amd64
          Maintainer: Your Name <your.email@example.com>
          Description: Custom FFmpeg build with WebRTC support
          EOF

          mkdir -p deb/opt/ffmpeg-webrtc/bin
          cp ffmpeg-ubuntu deb/opt/ffmpeg-webrtc/bin/ffmpeg
          cp ffprobe-ubuntu deb/opt/ffmpeg-webrtc/bin/ffprobe

          mkdir -p deb/usr/local/bin
          ln -s /opt/ffmpeg-webrtc/bin/ffmpeg deb/usr/local/bin/ffmpeg-webrtc
          ln -s /opt/ffmpeg-webrtc/bin/ffprobe deb/usr/local/bin/ffprobe-webrtc

          dpkg-deb --build deb ffmpeg-webrtc.deb

      - name: Prepare Alpine tarball
        run: |
          mkdir -p pkg/opt/ffmpeg-webrtc/bin
          cp ffmpeg-alpine pkg/opt/ffmpeg-webrtc/bin/ffmpeg
          cp ffprobe-alpine pkg/opt/ffmpeg-webrtc/bin/ffprobe

          mkdir -p pkg/usr/local/bin
          ln -s /opt/ffmpeg-webrtc/bin/ffmpeg pkg/usr/local/bin/ffmpeg-webrtc
          ln -s /opt/ffmpeg-webrtc/bin/ffprobe pkg/usr/local/bin/ffprobe-webrtc

          tar -czf ffmpeg-webrtc-alpine.tar.gz -C pkg .

      - name: Github App Token
        uses: actions/create-github-app-token@v3
        id: github-app-token
        with:
          app-id: ${{ secrets.GH_CROSS_REPO_APP_ID }}
          private-key: ${{ secrets.GH_CROSS_REPO_KEY }}
          owner: DigitalPath-Inc

      - name: Upload packages to release
        run: gh release upload v${{ needs.version.outputs.version }} ffmpeg-webrtc.deb ffmpeg-webrtc-alpine.tar.gz
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}


