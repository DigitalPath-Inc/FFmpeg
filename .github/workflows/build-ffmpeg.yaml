name: Build ffmpeg-webrtc packages

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read
  actions: read
  security-events: write

jobs:
  version:
    name: Generate release version
    uses: DigitalPath-Inc/.github-private/.github/workflows/semver-bump.yaml@master
    with:
      fail_on_error: false
  release:
    name: Create GitHub Release
    uses: DigitalPath-Inc/.github-private/.github/workflows/github-release.yaml@master
    needs:
      - version
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      gh-app-id: ${{ secrets.GH_CROSS_REPO_APP_ID }}
      gh-app-key: ${{ secrets.GH_CROSS_REPO_KEY }}
  build-alpine:
    name: Build ffmpeg-webrtc Alpine package
    needs:
      - version
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build in Alpine container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            alpine:latest sh -c "
              apk add --no-cache build-base yasm nasm x264-dev openssl-dev libsrt-dev pkgconf &&
              ./configure \
                --prefix=/opt/ffmpeg-webrtc \
                --enable-muxer=whip \
                --enable-openssl \
                --enable-libx264 \
                --enable-gpl \
                --enable-nonfree \
                --enable-static \
                --disable-shared \
                --enable-libsrt &&
              make -j\$(nproc) &&
              cp ffmpeg /workspace/ffmpeg-alpine &&
              cp ffprobe /workspace/ffprobe-alpine
            "

      - name: Prepare Alpine tarball
        run: |
          mkdir -p pkg/opt/ffmpeg-webrtc/bin
          cp ffmpeg-alpine pkg/opt/ffmpeg-webrtc/bin/ffmpeg
          cp ffprobe-alpine pkg/opt/ffmpeg-webrtc/bin/ffprobe

          mkdir -p pkg/usr/local/bin
          ln -s /opt/ffmpeg-webrtc/bin/ffmpeg pkg/usr/local/bin/ffmpeg-webrtc
          ln -s /opt/ffmpeg-webrtc/bin/ffprobe pkg/usr/local/bin/ffprobe-webrtc

          tar -czf ffmpeg-webrtc-alpine.tar.gz -C pkg .

      - name: Github App Token
        uses: actions/create-github-app-token@v3
        id: github-app-token
        with:
          app-id: ${{ secrets.GH_CROSS_REPO_APP_ID }}
          private-key: ${{ secrets.GH_CROSS_REPO_KEY }}
          owner: DigitalPath-Inc

      - name: Upload Alpine package to release
        run: gh release upload v${{ needs.version.outputs.version }} ffmpeg-webrtc-alpine.tar.gz
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}

  build-ubuntu:
    name: Build ffmpeg-webrtc Ubuntu package
    needs:
      - version
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential yasm nasm libx264-dev libssl-dev libsrt-openssl-dev

      - name: Build FFmpeg
        run: |
          ./configure --prefix=/opt/ffmpeg-webrtc --enable-muxer=whip --enable-openssl --enable-libx264 --enable-gpl --enable-nonfree --enable-static --disable-shared --enable-libsrt
          make -j$(nproc)

      - name: Prepare .deb package
        run: |
          mkdir -p build/DEBIAN
          cat << EOF > build/DEBIAN/control
          Package: ffmpeg-webrtc
          Version: ${{ needs.version.outputs.version }}
          Architecture: amd64
          Maintainer: Your Name <your.email@example.com>
          Description: Custom FFmpeg build with WebRTC support
          EOF

          mkdir -p build/opt/ffmpeg-webrtc/bin
          cp ffmpeg build/opt/ffmpeg-webrtc/bin/ffmpeg
          cp ffprobe build/opt/ffmpeg-webrtc/bin/ffprobe

          mkdir -p build/usr/local/bin
          ln -s /opt/ffmpeg-webrtc/bin/ffmpeg build/usr/local/bin/ffmpeg-webrtc
          ln -s /opt/ffmpeg-webrtc/bin/ffprobe build/usr/local/bin/ffprobe-webrtc

          dpkg-deb --build build ffmpeg-webrtc.deb

      - name: Github App Token
        uses: actions/create-github-app-token@v3
        id: github-app-token
        with:
          app-id: ${{ secrets.GH_CROSS_REPO_APP_ID }}
          private-key: ${{ secrets.GH_CROSS_REPO_KEY }}
          owner: DigitalPath-Inc

      - name: Upload Ubuntu package to release
        run: gh release upload v${{ needs.version.outputs.version }} ffmpeg-webrtc.deb
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}


